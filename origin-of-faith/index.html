<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>믿음의 근원 · Origin of Faith — Seunghyun Cha</title>
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #f1efe9;
      --ink: #1a1a1a;
      --ink-mid: #555450;
      --ink-soft: #8a8882;
      --line: #dcdad5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.75;
    }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--ink);
      z-index: 60;
      transition: width 0.08s linear;
    }

    .wrap { max-width: 1140px; margin: 0 auto; padding: 0 32px; }
    .mono {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
    }
    .border-top { border-top: 1px solid var(--line); }

    /* Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(250, 249, 247, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .header-row {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .back-link {
      text-decoration: none;
      color: var(--ink-mid);
      font-size: 13px;
    }
    .back-link:hover { color: var(--ink); }
    .site-name {
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.08em;
    }
    .top-nav { display: flex; align-items: center; gap: 22px; }
    .top-nav a {
      text-decoration: none;
      color: var(--ink-mid);
      font-size: 13.5px;
    }
    .top-nav a:hover { color: var(--ink); }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 5px 11px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lang-btn:hover { background: var(--ink); color: var(--bg); }

    /* Hero */
    .hero { padding: 76px 0 64px; }
    .hero h1 {
      font-size: clamp(32px, 4.5vw, 48px);
      font-weight: 600;
      margin-top: 12px;
      letter-spacing: -0.01em;
    }
    .hero-sub {
      margin-top: 12px;
      max-width: 600px;
      color: var(--ink-mid);
      font-size: 15.5px;
    }
    .hero-image {
      margin-top: 40px;
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
    }
    .hero-image img {
      width: 100%;
      display: block;
      aspect-ratio: 3 / 2;
      object-fit: cover;
    }

    /* Sections */
    .section { padding: 72px 0; }
    .section-eyebrow { margin-bottom: 24px; }

    /* Statement */
    .statement-body {
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-size: 15.5px;
      color: #2b2a28;
      word-break: keep-all;
    }

    /* Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 48px 36px;
    }
    .plate-card { cursor: pointer; }
    .plate-thumb-wrap {
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .plate-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .plate-card:hover .plate-thumb-wrap img { transform: scale(1.025); }
    .plate-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }
    .plate-desc {
      margin-top: 6px;
      font-size: 13.5px;
      color: var(--ink-mid);
    }

    /* Scroll Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(20, 20, 19, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 72px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lb-content {
      max-width: 1080px;
      width: 100%;
      text-align: center;
      transform: translateY(10px);
      transition: transform 0.35s ease;
    }
    .lightbox.open .lb-content { transform: translateY(0); }
    .lb-content img {
      max-height: 78vh;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .lb-caption {
      margin-top: 16px;
      color: #e6e4de;
      font-size: 13.5px;
    }
    .lb-plate {
      color: #a8a69f;
      margin-bottom: 4px;
    }
    .lb-btn {
      position: fixed;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #f5f4f0;
      width: 42px;
      height: 42px;
      font-size: 20px;
      cursor: pointer;
    }
    .lb-btn:hover { background: rgba(255, 255, 255, 0.12); }
    #lbClose { top: 24px; right: 24px; }
    #lbPrev { left: 24px; top: 50%; transform: translateY(-50%); }
    #lbNext { right: 24px; top: 50%; transform: translateY(-50%); }

    /* Footer */
    .site-footer {
      padding: 32px 0 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    @media (max-width: 760px) {
      .wrap { padding: 0 20px; }
      .gallery-grid { grid-template-columns: 1fr; gap: 36px; }
      .lightbox { padding: 24px 16px; }
      #lbPrev, #lbNext { top: auto; bottom: 20px; transform: none; }
      #lbPrev { left: 20px; }
      #lbNext { right: 20px; }
    }
  </style>
</head>
<body>
  <div id="scrollProgress" class="scroll-progress"></div>

    <header class="top-header">
    <div class="wrap header-row">
      <a href="./" class="site-name">ORIGIN OF FAITH</a>
      <nav class="top-nav">
        <a href="../" class="back-link">← Works</a>
        <a href="#statement" data-i18n="navStatement">Statement</a>
        <a href="#plates" data-i18n="navPlates">Plates</a>
        <button id="langToggle" class="lang-btn" type="button">EN</button>
      </nav>
    </div>
  </header>


  <main class="wrap">
    <section class="hero">
      <p class="mono" data-i18n="eyebrow">02 · PHOTOGRAPHY ARCHIVE · 2024 – 2026</p>
      <h1 data-i18n="title">믿음의 근원</h1>
      <p class="hero-sub" data-i18n="subtitle">텅 빈 한국 성당 열 곳의 제대를 정면으로 마주하며 기록한 믿음의 공간과 빛</p>
      <div class="hero-image reveal">
        <img src="images/full/origin_11.jpg" alt="믿음의 근원 대표 사진" />
      </div>
    </section>

    <section id="statement" class="section border-top">
      <p class="mono section-eyebrow" data-i18n="statementLabel">ARTIST STATEMENT</p>
      <div id="statementContent" class="statement-body reveal"></div>
    </section>

    <section id="plates" class="section border-top">
      <p class="mono section-eyebrow" data-i18n="platesLabel">PLATES · 01 – 11</p>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>
  </main>

  <footer class="wrap site-footer border-top">
    <p class="mono">© 2026 Seunghyun Cha</p>
    <a href="../" class="back-link mono">← Back to Works</a>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="lbClose" class="lb-btn" type="button" aria-label="닫기">×</button>
    <button id="lbPrev" class="lb-btn" type="button" aria-label="이전">‹</button>
    <div class="lb-content">
      <img id="lbImg" src="" alt="" />
      <div class="lb-caption">
        <p id="lbPlate" class="mono lb-plate"></p>
        <p id="lbDesc"></p>
      </div>
    </div>
    <button id="lbNext" class="lb-btn" type="button" aria-label="다음">›</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
