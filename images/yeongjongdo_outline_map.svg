<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="인천 영종도 및 미단시티 신지형학 윤곽선 인덱스 맵">
  <defs>
    <!-- 미세한 대각선 해칭 패턴 (미단시티 핵심 촬영 구역용) -->
    <pattern id="midanHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1A1A1A" stroke-width="0.6" stroke-opacity="0.16" />
    </pattern>
    <!-- 공항 구역 미세 점 패턴 -->
    <pattern id="airportDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#8A8882" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- 배경 (미술관 오프화이트) -->
  <rect x="0" y="0" width="1200" height="780" fill="#FAF9F7" />

  <!-- 외곽 측량 프레임 및 미세 좌표 격자선 -->
  <g stroke="#E6E4DE" stroke-width="0.75">
    <line x1="240" y1="36" x2="240" y2="744" />
    <line x1="480" y1="36" x2="480" y2="744" />
    <line x1="720" y1="36" x2="720" y2="744" />
    <line x1="960" y1="36" x2="960" y2="744" />
    <line x1="36" y1="200" x2="1164" y2="200" />
    <line x1="36" y1="400" x2="1164" y2="400" />
    <line x1="36" y1="600" x2="1164" y2="600" />
  </g>
  <rect x="36" y="36" width="1128" height="708" fill="none" stroke="#D5D2CA" stroke-width="1" />

  <!-- 좌표 눈금 텍스트 -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#9A978F">
    <text x="44" y="28">37°31'N</text>
    <text x="234" y="28">126°24'E</text>
    <text x="474" y="28">126°28'E</text>
    <text x="714" y="28">126°32'E</text>
    <text x="954" y="28">126°36'E</text>
    <text x="44" y="762">37°25'N  ·  TOPOGRAPHIC SURVEY OUTLINE  ·  YEONGJONGDO, INCHEON</text>
    <text x="1156" y="762" text-anchor="end">WGS84 · NOT FOR NAVIGATION</text>
  </g>

  <!-- 주변 섬 및 육지 실루엣 (초담색 배경 맥락) -->
  <g fill="#F0EEE9" stroke="#DDDAD2" stroke-width="0.8">
    <!-- 북서측 신도·시도 방면 -->
    <path d="M 380 36 L 590 36 L 615 95 L 555 150 L 455 170 L 415 110 Z" />
    <path d="M 65 36 L 235 36 L 265 110 L 185 155 L 95 125 Z" />
    <!-- 북동측 청라·육지 방면 -->
    <path d="M 960 36 L 1164 36 L 1164 185 L 1065 145 L 990 105 Z" />
  </g>

  <!-- 교량 축선 (영종대교 · 인천대교) -->
  <g stroke="#B8B5AD" stroke-width="1.1" stroke-dasharray="4 3" fill="none">
    <!-- 영종대교 (북동 방향) -->
    <line x1="948" y1="138" x2="1055" y2="36" />
    <!-- 인천대교 (남동 방향) -->
    <line x1="818" y1="452" x2="1048" y2="744" />
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#8A8882">
    <text x="1030" y="78">YEONGJONG BRIDGE ↗</text>
    <text x="955" y="692">INCHEON BRIDGE ↘</text>
  </g>

  <!-- 영종도 전체 해안선 윤곽 (메인 도형) -->
  <path
    d="M 118 426
       L 192 342 L 268 296 L 348 268 L 485 256 L 625 250
       L 702 216 L 732 190 L 748 112 L 758 72 L 798 58 L 832 48 L 872 68 L 915 102 L 975 118
       L 1045 162 L 1105 215 L 1138 286 L 1152 346 L 1172 384 L 1140 404 L 1096 426
       L 1038 452 L 968 446 L 875 456 L 795 498 L 718 574 L 635 636 L 545 678 L 442 718
       L 366 726 L 332 698 L 302 642 L 265 656 L 236 694 L 198 674 L 182 612 L 138 618
       L 92 602 L 54 574 L 58 518 L 76 474 L 58 432 L 82 406 Z"
    fill="#F4F2ED"
    stroke="#2B2A28"
    stroke-width="1.35"
    stroke-linejoin="round"
  />

  <!-- 인천국제공항 구역 (기하학적 간척 활주로 패턴) -->
  <g>
    <path
      d="M 218 358 L 354 278 L 624 260 L 664 388 L 692 522 L 545 636 L 444 686 L 372 682 L 290 546 L 208 428 Z"
      fill="url(#airportDots)"
      stroke="#C8C5BD"
      stroke-width="0.9"
    />
    <!-- 활주로 4본 (평행선) -->
    <g stroke="#A6A39B" stroke-width="1.4">
      <line x1="304" y1="358" x2="438" y2="578" />
      <line x1="336" y1="342" x2="470" y2="562" />
      <line x1="468" y1="296" x2="602" y2="516" />
      <line x1="504" y1="286" x2="638" y2="506" />
    </g>
    <!-- 터미널 1·2 미니멀 블록 -->
    <rect x="488" y="454" width="44" height="16" rx="2" fill="#E3E0D8" stroke="#9A978F" stroke-width="0.8" transform="rotate(-31 510 462)" />
    <rect x="378" y="392" width="38" height="14" rx="2" fill="#E3E0D8" stroke="#9A978F" stroke-width="0.8" transform="rotate(-31 397 399)" />
    <text x="415" y="492" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#7D7A72" letter-spacing="1.2">INCHEON INT'L AIRPORT</text>
  </g>

  <!-- 섬 내부 주요 간선 동선 (미세 차콜 선) -->
  <g fill="none" stroke="#8F8C84" stroke-width="0.95">
    <!-- 공항 외곽 순환 및 미단시티 연결 동선 -->
    <path d="M 132 428 L 210 348 L 348 276 L 635 260 L 748 195 L 788 102 L 855 88 L 935 124" />
    <path d="M 635 260 L 708 386 L 818 452 L 1068 386" />
    <path d="M 788 102 L 892 222 L 1068 386" />
  </g>

  <!-- =========================================================
       ZONE 1: 미단시티 / 골든테라시티 (핵심 촬영 구역 — 우측 상단)
       ========================================================= -->
  <g id="zone-midan">
    <path
      d="M 754 114 L 764 74 L 802 60 L 836 52 L 876 74 L 916 106 L 948 134 L 914 166 L 866 154 L 832 132 L 778 138 L 762 192 L 732 192 Z"
      fill="url(#midanHatch)"
      stroke="#1A1A1A"
      stroke-width="1.6"
    />
    <!-- 미단시티 내부 촬영 포인트 핀 (Ch.01 ~ Ch.03) -->
    <circle cx="806" cy="96" r="4.5" fill="#1A1A1A" />
    <circle cx="852" cy="88" r="4.5" fill="#1A1A1A" />
    <circle cx="892" cy="126" r="4.5" fill="#1A1A1A" />
    <circle cx="764" cy="152" r="3.5" fill="#FAF9F7" stroke="#1A1A1A" stroke-width="1.4" />

    <!-- 지시선 및 라벨 -->
    <polyline points="852,88 940,56 972,56" fill="none" stroke="#1A1A1A" stroke-width="0.9" />
    <text x="978" y="52" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1A1A1A">01–03 · MIDAN CITY</text>
    <text x="978" y="68" font-family="-apple-system, Apple SD Gothic Neo, sans-serif" font-size="11" fill="#555450">미단시티 (구 골든테라시티) · 핵심 촬영지</text>
    <text x="978" y="83" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#8A8882">Plates 01–20 · Prepared Ground / Infrastructure / Frames</text>
  </g>

  <!-- =========================================================
       ZONE 2: 영종하늘도시 (우측 중하단 — 아파트 군집 경계)
       ========================================================= -->
  <g id="zone-skycity">
    <path
      d="M 1020 318 L 1084 282 L 1142 332 L 1094 402 L 1032 364 Z"
      fill="#EAE7DF"
      fill-opacity="0.7"
      stroke="#555450"
      stroke-width="1.2"
      stroke-dasharray="4 2"
    />
    <circle cx="1096" cy="342" r="4" fill="#555450" />
    <polyline points="1116,374 1146,456 1004,456" fill="none" stroke="#555450" stroke-width="0.85" />
    <text x="1000" y="476" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2B2A28">04 · SKY CITY EDGE</text>
    <text x="1000" y="492" font-family="-apple-system, Apple SD Gothic Neo, sans-serif" font-size="10.5" fill="#66645E">영종하늘도시 · 습지 너머 아파트 군집 (Plates 21–22)</text>
  </g>

  <!-- =========================================================
       ZONE 3: 서측 리조트 권역 (좌측 중하단 — 인스파이어·수변 원경)
       ========================================================= -->
  <g id="zone-west">
    <path
      d="M 122 442 L 194 422 L 246 472 L 208 518 L 142 478 Z"
      fill="#EAE7DF"
      fill-opacity="0.7"
      stroke="#555450"
      stroke-width="1.2"
      stroke-dasharray="4 2"
    />
    <circle cx="182" cy="466" r="4" fill="#555450" />
    <polyline points="164,484 118,656 150,656" fill="none" stroke="#555450" stroke-width="0.85" />
    <text x="156" y="652" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2B2A28">04 · INSPIRE RESORT &amp; UNDEVELOPED ZONE</text>
    <text x="156" y="668" font-family="-apple-system, Apple SD Gothic Neo, sans-serif" font-size="10.5" fill="#66645E">인스파이어 리조트 인근 미개발 구역·수변 원경 (Plates 23–25)</text>
  </g>

  <!-- 방위표(North Arrow) & 축척 막대(Scale Bar) -->
  <g transform="translate(82, 82)">
    <line x1="0" y1="26" x2="0" y2="0" stroke="#1A1A1A" stroke-width="1.2" />
    <polyline points="-4,8 0,0 4,8" fill="none" stroke="#1A1A1A" stroke-width="1.2" />
    <text x="0" y="-8" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#1A1A1A">N</text>
  </g>

  <g transform="translate(72, 704)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#1A1A1A" stroke-width="1.2" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#1A1A1A" stroke-width="1.2" />
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#1A1A1A" stroke-width="1" />
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#1A1A1A" stroke-width="1.2" />
    <text x="0" y="16" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#555450">0</text>
    <text x="56" y="16" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#555450">2</text>
    <text x="112" y="16" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#555450">4 km</text>
  </g>

  <!-- 범례 (우측 하단) -->
  <g transform="translate(960, 610)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#555450">
    <rect x="0" y="0" width="180" height="106" fill="#FAF9F7" fill-opacity="0.92" stroke="#D5D2CA" stroke-width="0.8" />
    <text x="12" y="20" font-weight="600" fill="#1A1A1A">LEGEND</text>
    <rect x="12" y="32" width="16" height="10" fill="url(#midanHatch)" stroke="#1A1A1A" stroke-width="1" />
    <text x="36" y="41">Primary Survey Site</text>
    <rect x="12" y="52" width="16" height="10" fill="#EAE7DF" stroke="#555450" stroke-width="1" stroke-dasharray="3 2" />
    <text x="36" y="61">Capital Edge Zones</text>
    <circle cx="20" cy="77" r="3.5" fill="#1A1A1A" />
    <text x="36" y="81">Survey Anchor Points</text>
    <line x1="12" y1="95" x2="28" y2="95" stroke="#8F8C84" stroke-width="1" />
    <text x="36" y="98">Primary Transit Axis</text>
  </g>
</svg>
